name: oboia
description: OBOIA — AR wallpaper marketplace.
publish_to: 'none'
version: 1.0.0+81
environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'
dependencies:
  flutter:
    sdk: flutter
  # Firebase
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_storage: ^13.3.0
  google_sign_in: ^6.3.0
  # State management
  provider: ^6.1.2
  # Navigation
  go_router: ^13.2.0
  # Networking + caching
  dio: ^5.4.3
  path_provider: ^2.1.3
  crypto: ^3.0.3
  cached_network_image: ^3.4.0
  flutter_cache_manager: ^3.3.2
  # UI + Animations
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  intl: ^0.19.0
  # Media
  image_picker: ^1.0.7
  # Permissions (camera for AR)
  permission_handler: ^11.3.1
  # Local storage (for pinned shop persistence)
  shared_preferences: ^2.2.2                    # ★ NEW
  # Diagnostics
  url_launcher: ^6.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
